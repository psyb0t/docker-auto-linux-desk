[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autolinuxdesk"
version = "0.3.0"
description = "Linux desktop automation server: humanized X11 input, window and process control, HTTP and MCP API."
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.12"
dependencies = [
    "pyautogui",
    "fastapi",
    "uvicorn",
    "fastmcp",
    "Pillow",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
